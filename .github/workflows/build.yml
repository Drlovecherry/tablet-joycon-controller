name: Build Joy-Con Merge APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Checkout upstream Joy-Con Merge source
        uses: actions/checkout@v4
        with:
          repository: Faraw4y/joycon-merge
          ref: 0b6ee34112b23b21e68875aa9d11f9d49d53e0e8
          path: upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          echo "y" | sdkmanager "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Build release APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JoyConMerge-APK
          path: upstream/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
